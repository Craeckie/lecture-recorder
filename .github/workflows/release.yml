name: Release

# Release by version bump: bump versionName + versionCode in app/build.gradle.kts, push to the
# default branch, done. This workflow creates tag v<versionName> and a GitHub release with the
# signed APK. Tags are never pushed by hand. Pushes that don't change the version are no-ops.
# workflow_dispatch re-runs a failed release of the current version.
#
# Adopted from the workspace templates' release.yml (templates README, "Releasing (Android)");
# the only deviation is the sign step, since this project signs Gradle-side.

on:
  push:
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION_FILE: app/build.gradle.kts

jobs:
  check:
    # Only the default branch releases; a push to any other branch never does.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, for the upgradeability guard

      - name: Read version, skip if already released
        id: version
        run: |
          read_code() { sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n1; }
          read_name() { sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n1; }
          NAME=$(read_name < "$VERSION_FILE")
          CODE=$(read_code < "$VERSION_FILE")
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error file=$VERSION_FILE::Could not read a literal versionName = \"x.y.z\" and versionCode = N"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$NAME" > /dev/null; then
            echo "v$NAME is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Upgradeability guard: the new versionCode must be greater than the previous release's.
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV" ]; then
            PREV_CODE=$(git show "$PREV:$VERSION_FILE" 2>/dev/null | read_code)
            if [ -z "$PREV_CODE" ]; then
              echo "::error::Could not read versionCode from $VERSION_FILE at $PREV"
              exit 1
            fi
            if [ "$CODE" -le "$PREV_CODE" ]; then
              echo "::error file=$VERSION_FILE::versionCode $CODE is not greater than $PREV's $PREV_CODE; the APK would not install as an update"
              exit 1
            fi
          fi
          echo "Releasing v$NAME (versionCode $CODE, previous: ${PREV:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_NAME: ${{ needs.check.outputs.name }}
      VERSION_CODE: ${{ needs.check.outputs.code }}
    steps:
      # Never publish unsigned: fail before building if the secrets are missing.
      - name: Require signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASSWORD repo secrets are required to release"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      # Signing is Gradle-side here (app/build.gradle.kts reads KEYSTORE_BASE64/KEYSTORE_PASSWORD
      # from the job env), so assembleRelease already produces a signed app-release.apk.
      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check and verify signed APK
        run: |
          SIGNED=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SIGNED" ]; then
            echo "::error::$SIGNED was not produced; refusing to release (never app-release-unsigned.apk)"
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          REPO="${GITHUB_REPOSITORY#*/}"
          APK="${REPO,,}-v${VERSION_NAME}.apk"
          cp "$SIGNED" "$APK"
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG" ]; then
            NOTES=(--notes-file "$CHANGELOG")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "v$VERSION_NAME" "$APK" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" \
            "${NOTES[@]}"
